name: "MPC Optimizer + Dashboard"
description: "Runs the joint MPC optimizer (15-min loop) and the web dashboard"
version: "2.0.0"
slug: "mpc_optimizer"
init: false

arch:
  - aarch64
  - amd64
  - armv7

homeassistant_api: false
hassio_api: false
host_network: false

# Expose the dashboard. Reach it at http://<ha-ip>:8080
ports:
  8080/tcp: 8080
ports_description:
  8080/tcp: "MPC dashboard web UI"

# Public manifest; code pulled at start from the PRIVATE repo (GITHUB_REPO).
# Blank host defaults fall back to the values in the private repo's config.py.
options:
  GITHUB_REPO: "elvinlemmens/mpc_home"
  GIT_REF: "v0.1.0"
  GITHUB_TOKEN: ""
  INFLUX_TOKEN: ""
  MQTT_HOST: ""
  MQTT_USER: ""
  MQTT_PASSWORD: ""
  LOXONE_HOST: ""
  LOXONE_USER: ""
  LOXONE_PASSWORD: ""
  SOLAREDGE_API_KEY: ""
schema:
  GITHUB_REPO: str
  GIT_REF: str
  GITHUB_TOKEN: password
  INFLUX_TOKEN: password
  MQTT_HOST: str
  MQTT_USER: str
  MQTT_PASSWORD: password
  LOXONE_HOST: str
  LOXONE_USER: str
  LOXONE_PASSWORD: password
  SOLAREDGE_API_KEY: "password?"
