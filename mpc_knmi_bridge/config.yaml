name: "MPC KNMI MSG-CPP Bridge"
description: "Syncs MSG-CPP satellite GHI irradiance from KNMI to InfluxDB. Runs hourly."
version: "2.0.0"
slug: "mpc_knmi_bridge"
init: false

arch:
  - aarch64
  - amd64
  - armv7

homeassistant_api: false
hassio_api: false
host_network: false

# Public manifest; code pulled at start from the PRIVATE repo (GITHUB_REPO).
options:
  GITHUB_REPO: "elvinlemmens/mpc_home"
  GIT_REF: "v0.1.0"
  GITHUB_TOKEN: ""
  INFLUX_TOKEN: ""
  KNMI_API_KEY: ""
schema:
  GITHUB_REPO: str
  GIT_REF: str
  GITHUB_TOKEN: password
  INFLUX_TOKEN: password
  KNMI_API_KEY: password
